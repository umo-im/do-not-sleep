name: Capture localized Do Not Sleep guide images
on:
  push:
    branches: [codex/guide-localized-screenshots-20261119]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Capture the release's SwiftUI view on macOS
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Do Not Sleep Capture.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" screenshots
          cp -R Sources/DoNotSleep/Resources/. "$app/Contents/Resources/"
          python3 - "$app/Contents/Info.plist" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], 'wb') as file:
              plistlib.dump({
                  'CFBundleIdentifier': 'im.umo.dns.capture',
                  'CFBundleExecutable': 'Capture',
                  'CFBundleName': 'Do Not Sleep',
                  'CFBundlePackageType': 'APPL',
                  'CFBundleDevelopmentRegion': 'en',
                  'LSUIElement': True,
              }, file)
          PY
          cat > Capture.swift <<'SWIFT'
          import AppKit
          import SwiftUI

          @main
          @MainActor
          struct Capture {
              static func main() throws {
                  let arguments = CommandLine.arguments
                  let locale = arguments[1]
                  let destination = URL(fileURLWithPath: arguments[2])
                  let key = "settings.protection.title"
                  let resource = Bundle.main.path(forResource: locale, ofType: "lproj").flatMap { Bundle(path: $0) }
                  let expected = resource?.localizedString(forKey: key, value: nil, table: nil)
                  guard let expected, expected != key, L10n.string(key) == expected else {
                      fatalError("The app selected \(Bundle.main.preferredLocalizations) instead of \(locale).")
                  }

                  let app = NSApplication.shared
                  app.setActivationPolicy(.accessory)
                  let controller = SleepAssertionController()
                  controller.setScreenSaverEnabled(true)
                  defer { controller.setScreenSaverEnabled(false) }
                  let content = MenuBarContentView(
                      sleepController: controller,
                      launchAtLoginController: LaunchAtLoginController()
                  )
                  .environment(\.colorScheme, .light)
                  .background(Color(nsColor: .windowBackgroundColor))

                  let view = NSHostingView(rootView: content)
                  view.appearance = NSAppearance(named: .aqua)
                  let size = view.fittingSize
                  let bounds = NSRect(x: 0, y: 0, width: ceil(size.width), height: ceil(size.height))
                  guard bounds.width >= 350, bounds.height >= 500 else {
                      fatalError("App content did not lay out: \(bounds).")
                  }

                  let window = NSWindow(contentRect: bounds, styleMask: .borderless, backing: .buffered, defer: false)
                  window.appearance = view.appearance
                  window.contentView = view
                  window.orderFrontRegardless()
                  RunLoop.current.run(until: Date(timeIntervalSinceNow: 0.5))
                  view.layoutSubtreeIfNeeded()
                  guard let bitmap = NSBitmapImageRep(
                      bitmapDataPlanes: nil, pixelsWide: Int(bounds.width * 2), pixelsHigh: Int(bounds.height * 2),
                      bitsPerSample: 8, samplesPerPixel: 4, hasAlpha: true, isPlanar: false,
                      colorSpaceName: .deviceRGB, bytesPerRow: 0, bitsPerPixel: 0
                  ) else { fatalError("Could not allocate image.") }
                  bitmap.size = bounds.size
                  view.cacheDisplay(in: bounds, to: bitmap)
                  guard let png = bitmap.representation(using: .png, properties: [:]) else {
                      fatalError("Could not encode the app capture.")
                  }
                  try png.write(to: destination)
                  print("\(locale) · \(expected) · \(bitmap.pixelsWide) × \(bitmap.pixelsHigh) · display \(controller.isPreventingScreenSaver)")
              }
          }
          SWIFT
          swiftc -parse-as-library -target "$(uname -m)-apple-macos13.0" -O -framework IOKit \
            Capture.swift Sources/DoNotSleep/{Localization,MenuBarContentView,MenuBarSections,SleepAssertionController,LaunchAtLoginController}.swift \
            -o "$app/Contents/MacOS/Capture"
          for language in ko en ja zh-Hans; do
            "$app/Contents/MacOS/Capture" "$language" "$PWD/screenshots/$language.png" -AppleLanguages "($language)"
          done
      - name: Upload app panel captures
        uses: actions/upload-artifact@v4
        with:
          name: do-not-sleep-app-captures
          path: screenshots/
          if-no-files-found: error
          retention-days: 3

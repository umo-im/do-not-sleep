name: Sync release install metadata

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: sync-release-install
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync README and Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/sync-release-install.sh

      - name: Publish installation metadata
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- README.md Casks/umo-do-not-sleep.rb
          if git diff --cached --quiet; then
            echo 'Installation metadata is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync release installation metadata'
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
